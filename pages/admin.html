<div class="space-y-8 max-w-4xl mx-auto pb-12">
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 rounded-3xl shadow-xl flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-extrabold text-blue-400">🔐 Faculty Admin Console</h1>
            <p class="text-xs text-gray-400 mt-1">Manage study materials, test timetables, quizzes, and student rankings.</p>
        </div>
        <button type="button" onclick="loadPage('home')" class="bg-white/10 hover:bg-white/20 text-xs px-4 py-2 rounded-xl transition">Exit Admin</button>
    </div>

    <!-- 1. Post New Study Material -->
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 rounded-3xl space-y-4">
        <h2 class="text-lg font-bold">📚 Post Study Material</h2>
        <form id="material-form" onsubmit="handlePostMaterial(event)" class="space-y-3">
            <input type="text" id="mat-title" placeholder="Material Title (e.g., Accounts Chapter 1 Notes)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
            <input type="text" id="mat-subject" placeholder="Subject (e.g., Accountancy)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
            <input type="url" id="mat-url" placeholder="PDF File URL (Google Drive / Link)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-2xl text-sm font-medium transition shadow-lg shadow-blue-600/30">Upload Material</button>
        </form>
    </div>

    <!-- 2. Post Test Timetable -->
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 rounded-3xl space-y-4">
        <h2 class="text-lg font-bold">📅 Post Test Timetable</h2>
        <form id="test-form" onsubmit="handlePostTest(event)" class="space-y-3">
            <input type="text" id="test-name" placeholder="Test Name (e.g., Unit Test 1)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
            <input type="text" id="test-subject" placeholder="Subject" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
            <input type="date" id="test-date" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500 text-gray-300">
            <textarea id="test-syllabus" placeholder="Syllabus details..." required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500 h-24"></textarea>
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-2xl text-sm font-medium transition shadow-lg shadow-blue-600/30">Publish Test Schedule</button>
        </form>
    </div>

    <!-- 3. Create New Quiz -->
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 rounded-3xl space-y-4">
        <h2 class="text-lg font-bold">✍️ Create New Quiz</h2>
        <form id="quiz-form" onsubmit="handleCreateQuiz(event)" class="space-y-3">
            <input type="text" id="quiz-title" placeholder="Quiz Title (e.g., Partnership Accounts Quiz 1)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
            <input type="text" id="quiz-subject" placeholder="Subject (e.g., Accountancy)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">

            <div class="border-t border-white/10 pt-3 mt-3">
                <h3 class="text-sm font-semibold mb-2 text-blue-300">Add First Question</h3>
                <input type="text" id="q-text" placeholder="Question Text" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm mb-2 focus:outline-none focus:border-blue-500">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" id="q-optA" placeholder="Option A" required class="bg-white/5 border border-white/10 p-2.5 rounded-xl text-sm">
                    <input type="text" id="q-optB" placeholder="Option B" required class="bg-white/5 border border-white/10 p-2.5 rounded-xl text-sm">
                    <input type="text" id="q-optC" placeholder="Option C" required class="bg-white/5 border border-white/10 p-2.5 rounded-xl text-sm">
                    <input type="text" id="q-optD" placeholder="Option D" required class="bg-white/5 border border-white/10 p-2.5 rounded-xl text-sm">
                </div>
                <select id="q-correct" class="w-full bg-[#060A12] border border-white/10 p-3 rounded-2xl text-sm text-gray-300 mb-2">
                    <option value="A">Correct Option: A</option>
                    <option value="B">Correct Option: B</option>
                    <option value="C">Correct Option: C</option>
                    <option value="D">Correct Option: D</option>
                </select>
            </div>
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-2xl text-sm font-medium transition shadow-lg shadow-blue-600/30">Save Quiz & Question</button>
        </form>
<!-- Add Standalone HTML Quiz -->
<div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 rounded-3xl space-y-4">
    <h2 class="text-lg font-bold">🌐 Add HTML Quiz File</h2>
    <form id="html-quiz-form" onsubmit="handleAddHtmlQuiz(event)" class="space-y-3">
        <input type="text" id="html-quiz-title" placeholder="Quiz Title (e.g., Partnership Quiz 1)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
        <input type="text" id="html-quiz-subject" placeholder="Subject (e.g., Accountancy)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
        <input type="text" id="html-quiz-url" placeholder="HTML File Path or URL (e.g., quizzes/quiz1.html)" required class="w-full bg-white/5 border border-white/10 p-3 rounded-2xl text-sm focus:outline-none focus:border-blue-500">
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-2xl text-sm font-medium transition shadow-lg shadow-blue-600/30">Save HTML Quiz</button>
    </form>
</div>

    </div>
</div>
