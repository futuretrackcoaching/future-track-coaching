<div class="space-y-6 max-w-4xl mx-auto pb-12">
    <!-- Header & Filters -->
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-6 rounded-3xl shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-extrabold">Student Quiz Vault</h1>
            <p class="text-xs text-gray-400 mt-1">Select a quiz, test your knowledge, and view real-time rankings & leaderboards.</p>
        </div>
        
        <!-- Filter Controls -->
        <div class="flex gap-2 w-full md:w-auto">
            <select id="filter-subject" onchange="filterQuizzes()" class="bg-[#060A12] border border-white/10 px-4 py-2.5 rounded-2xl text-xs text-gray-300 focus:outline-none">
                <option value="all">All Subjects</option>
                <option value="Accountancy">Accountancy</option>
                <option value="Economics">Economics</option>
                <option value="Business Studies">Business Studies</option>
                <option value="Mathematics">Mathematics</option>
            </select>
            <select id="filter-sort" onchange="filterQuizzes()" class="bg-[#060A12] border border-white/10 px-4 py-2.5 rounded-2xl text-xs text-gray-300 focus:outline-none">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>
        </div>
    </div>

    <!-- Dynamic Container (Swaps between Quiz List, Active Quiz Player, and Results Leaderboard) -->
    <div id="quiz-portal-container">
        <!-- Quizzes List Loaded Dynamically Here -->
        <div id="quiz-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-gray-400 text-sm col-span-2 text-center py-8">Loading available quizzes from database...</p>
        </div>
    </div>
</div>
