<!-- pages/quiz.html -->
<div class="space-y-6 max-w-5xl mx-auto pb-14">
    <div class="glass-card p-6 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h1 class="text-2xl font-extrabold">Student Quiz Vault</h1>
            <p class="text-xs text-gray-400 mt-1">Cached student profile, fullscreen mode, live timer, and public results.</p>
        </div>
        <div class="flex flex-wrap gap-2 w-full md:w-auto">
            <select id="filter-class" onchange="filterQuizzes()" class="bg-[#091020] border border-white/10 px-3.5 py-2.5 rounded-2xl text-xs text-gray-200 focus:outline-none">
                <option value="all">All Classes</option>
                <option value="8th">8th</option>
                <option value="9th">9th</option>
                <option value="10th">10th</option>
                <option value="11th">11th</option>
                <option value="12th">12th</option>
            </select>
            <select id="filter-subject" onchange="filterQuizzes()" class="bg-[#091020] border border-white/10 px-3.5 py-2.5 rounded-2xl text-xs text-gray-200 focus:outline-none">
                <option value="all">All Subjects</option>
                <option value="Accountancy">Accountancy</option>
                <option value="Economics">Economics</option>
                <option value="Business Studies">Business Studies</option>
                <option value="Mathematics">Mathematics</option>
            </select>
            <select id="filter-sort" onchange="filterQuizzes()" class="bg-[#091020] border border-white/10 px-3.5 py-2.5 rounded-2xl text-xs text-gray-200 focus:outline-none">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>
        </div>
    </div>

    <div id="quiz-portal-container">
        <div id="quiz-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-gray-400 text-sm col-span-2 text-center py-8">Loading quizzes...</p>
        </div>
    </div>
</div>
